packages:
  - 'packages/*'
  - 'example'

allowBuilds:
  electron: true
  esbuild: true
  lefthook: true

catalog:
  react: '19.2.8'
  react-dom: '19.2.8'
  '@types/node': '^24.13.3'
  '@types/react': '^19.2.14'
  rozenite: '^2.0.0'
  '@rozenite/agent-bridge': '^2.0.0'
  '@rozenite/agent-shared': '^2.0.0'
  '@rozenite/metro': '^2.0.0'
  '@rozenite/plugin-bridge': '^2.0.0'
  '@rozenite/testing': '^2.0.0'
  '@rozenite/vite-plugin': '^2.0.0'

# Both packages declare a `development` condition in their exports map that
# points at TypeScript sources their published tarballs do not contain. It works
# inside the Rozenite monorepo and breaks for every other consumer: any tool that
# enables that condition, Vitest included, resolves them to files that do not
# exist. The patches drop the condition so the published entry points are used.
patchedDependencies:
  '@rozenite/agent-bridge@2.4.0': patches/@rozenite__agent-bridge@2.4.0.patch
  '@rozenite/agent-shared@2.4.0': patches/@rozenite__agent-shared@2.4.0.patch
